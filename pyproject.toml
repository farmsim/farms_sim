[build-system]
requires = ["setuptools>=68.0", "wheel", "Cython>=3.0", "farms_core"]
build-backend = "setuptools.build_meta"

[project]
name = "farms_sim"
version = "0.1.0"
description = "FARMS package for interfacing simulations with simulators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "farms_core",
    "farms_mujoco",
    "tqdm",
]
keywords = ["farms", "framework", "animals", "robot", " modeling", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Artificial Life",
  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
]

[project.scripts]
farmsim = "farms_sim._bootstrap:main"

[project.urls]
Homepage = "https://farmsim.dev"
Documentation = "https://farmsim.dev"
Repository = "https://github.com/farmsim/farms_sim.git"
Issues = "https://github.com/farmsim/farms_sim/issues"
Changelog = "https://github.com/farmsim/farms_sim/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# This is equivalent to find_packages() with no arguments

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
farms_sim = []
